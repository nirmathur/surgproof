rules:
- id: cond.acute_chole.visibility
  statement: 'Acute cholecystitis displays hallmark visible signs: hyperaemia, wall edema, distension, and fluid'
  source_id: tg18
  quote: Gallbladder with distension/edema/thickened wall; hyperemia; adhesions obscuring the body of the gallbladder.
  quote_verified: false
  evidence_grade: guideline_expert_opinion
  seed: false
  quote_status: grounding_only
- id: cond.gangrenous.necrosis
  statement: Gangrenous cholecystitis is visually characterized by patchy or extensive wall necrosis
  source_id: tg18
  quote: Severe inflammation, complete adherence to the liver bed, wall necrosis/gangrene, or extensive omental wrapping.
  quote_verified: false
  evidence_grade: guideline_expert_opinion
  seed: false
  quote_status: grounding_only
- id: cond.mirizzi.external_data
  statement: Mirizzi syndrome type requires cholangiography or cross-sectional imaging and cannot be fully staged from video
  source_id: tg18
  quote: mirizzi syndrome requires preoperative or intraoperative cholangiography
  quote_verified: false
  evidence_grade: guideline_expert_opinion
  seed: true
  quote_status: not_found
- id: cond.cancer.not_inferable
  statement: Malignancy or gallbladder cancer cannot be confirmed without histopathology
  source_id: statpearls
  quote: gallbladder carcinoma requires histological confirmation
  quote_verified: false
  evidence_grade: guideline_expert_opinion
  seed: true
  quote_status: not_found
