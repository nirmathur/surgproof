rules:
- id: phase.order.linear
  statement: Cholec80 phases follow a broadly linear sequence from preparation to retraction
  source_id: cholec80
  quote: phases are defined sequentially
  quote_verified: false
  evidence_grade: cohort
  seed: true
  quote_status: not_found
- id: phase.transition.p5_p6_swap
  statement: Gallbladder packaging (P5) and cleaning coagulation (P6) may occur in either order
  source_id: cholec80
  quote: packaging and cleaning coagulation can be inverted
  quote_verified: false
  evidence_grade: cohort
  seed: true
  quote_status: not_found
- id: phase.p6_optional
  statement: Cleaning and coagulation phase (P6) is optional before final retraction
  source_id: cholec80
  quote: cleaning and coagulation phase may be omitted
  quote_verified: false
  evidence_grade: cohort
  seed: true
  quote_status: not_found
- id: phase.p2_duration
  statement: Calot triangle dissection is typically the longest phase bounding plausible timing
  source_id: cholec80
  quote: calot triangle dissection is the longest phase
  quote_verified: false
  evidence_grade: cohort
  seed: true
  quote_status: not_found
- id: phase.tool_visibility
  statement: A tool counts as present only if at least half its tip is visible
  source_id: cholec80
  quote: at least half of the tool tip is visible
  quote_verified: false
  evidence_grade: cohort
  seed: true
  quote_status: not_found
- id: phase.clipper_in_p3
  statement: Clipper is expected during clipping and cutting phase P3 and rarely elsewhere
  source_id: cholec80
  quote: clipper is used during clipping and cutting
  quote_verified: false
  evidence_grade: derived
  seed: true
  quote_status: not_found
